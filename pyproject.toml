[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextstep"
version = "0.1.0"
description = "Pick Up Where You Left Off - With or Without AI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "NextStep" }]
dependencies = [
    "alembic>=1.14",
    "mcp>=1.0",
    "platformdirs>=4.3",
    "pydantic>=2.9",
    "pyside6>=6.8,<6.12",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    "nuitka==4.1.1",
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pyright>=1.1.390",
    "ruff>=0.8",
]

[project.scripts]
nextstep = "nextstep.main:main"
nextstep-mcp = "nextstep.mcp_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextstep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "src/nextstep/migrations"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
